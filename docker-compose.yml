services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: ${RAG_ENV_FILE:-.env}
    environment:
      RAG_ENVIRONMENT: production
      RAG_DATA_DIR: /data
      RAG_OLLAMA_BASE_URL: http://ollama:11434
      RAG_ALLOW_MODEL_DOWNLOADS: "false"
    volumes:
      - rag_data:/data
      - embedding_models:/models
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 4g
    stop_grace_period: 180s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  ollama:
    image: ollama/ollama:0.23.1
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  provision:
    build: .
    profiles: [setup]
    env_file: ${RAG_ENV_FILE:-.env}
    environment:
      RAG_DATA_DIR: /data
      RAG_OLLAMA_BASE_URL: http://ollama:11434
      RAG_ALLOW_MODEL_DOWNLOADS: "true"
    volumes:
      - embedding_models:/models
    depends_on:
      ollama:
        condition: service_healthy
    command: ["python", "-m", "scripts.prepare_models"]

volumes:
  rag_data:
  embedding_models:
  ollama_models:
